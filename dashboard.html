<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tennis Model — Live Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #0d1b14;
    --court-line: #1c3326;
    --surface: #14261c;
    --surface-raised: #1a2f22;
    --chalk: #eef2ea;
    --chalk-dim: #8fa396;
    --ball: #d7e35a;
    --ball-dim: #8a9445;
    --up: #6fcf97;
    --down: #e0765a;
    --border: #24402f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--court);
    background-image:
      linear-gradient(var(--court-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--court-line) 1px, transparent 1px);
    background-size: 100% 3px, 3px 100%;
    background-position: 0 0, 0 0;
    background-repeat: no-repeat;
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 48px;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ball);
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 6px 0 4px;
    line-height: 1.1;
  }

  .sub {
    color: var(--chalk-dim);
    font-size: 14px;
    margin: 0;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0 28px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
  }

  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--ball);
    display: block;
  }

  .stat .label {
    color: var(--chalk-dim);
    font-size: 11px;
    margin-top: 4px;
    display: block;
  }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin: 24px 0 10px;
    color: var(--chalk);
  }

  .match {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .match .names {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .match .names span {
    font-size: 15px;
    font-weight: 600;
  }

  .match .names .vs {
    color: var(--chalk-dim);
    font-weight: 400;
    font-size: 12px;
  }

  .match .meta {
    display: flex;
    gap: 14px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .match .meta div {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
  }

  .match .meta div b {
    color: var(--chalk);
    font-weight: 500;
  }

  .edge-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 8px;
  }

  .edge-tag.pos { background: rgba(111, 207, 151, 0.15); color: var(--up); }
  .edge-tag.neu { background: rgba(143, 163, 150, 0.15); color: var(--chalk-dim); }

  .empty, .loading, .error {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }

  .error { color: var(--down); }

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 32px;
  }

  a { color: var(--ball); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">// LIVE PREDICTIONS BOARD</div>
  <h1>Tennis Model</h1>
  <p class="sub">Reads directly from your GitHub prediction log — refresh to update.</p>
</header>

<main>
  <div class="stat-row" id="stat-row" style="display:none;">
    <div class="stat"><span class="num" id="stat-total">–</span><span class="label">logged</span></div>
    <div class="stat"><span class="num" id="stat-edge">–</span><span class="label">avg edge</span></div>
    <div class="stat"><span class="num" id="stat-value">–</span><span class="label">value bets</span></div>
  </div>

  <div id="content">
    <div class="loading">Loading predictions_log.csv from GitHub…</div>
  </div>
</main>

<footer>updated on load · edit REPO_OWNER / REPO_NAME below to point at your repo</footer>

<script>
  // ---- point this at your repo ----
  const REPO_OWNER = "arbaazshakil-dev";
  const REPO_NAME = "Live-bet-all-sport";
  const BRANCH = "main";
  const CSV_PATH = "data/predictions_log.csv";
  // ----------------------------------

  const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${CSV_PATH}`;

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).map(line => {
      const cells = line.split(",");
      const row = {};
      headers.forEach((h, i) => row[h] = (cells[i] || "").trim());
      return row;
    });
  }

  function pct(n) {
    const f = parseFloat(n);
    if (isNaN(f)) return null;
    return (f * 100).toFixed(1) + "%";
  }

  function render(rows) {
    const content = document.getElementById("content");

    if (!rows.length) {
      content.innerHTML = `<div class="empty">No predictions logged yet.<br>The board fills in once a live match has been scored by a run.</div>`;
      return;
    }

    // newest first
    rows.reverse();

    const edges = rows.map(r => parseFloat(r.edge)).filter(n => !isNaN(n));
    const avgEdge = edges.length ? (edges.reduce((a, b) => a + b, 0) / edges.length) : null;
    const valueCount = edges.filter(e => e >= 0.05).length;

    document.getElementById("stat-row").style.display = "grid";
    document.getElementById("stat-total").textContent = rows.length;
    document.getElementById("stat-edge").textContent = avgEdge !== null ? (avgEdge * 100).toFixed(1) + "%" : "–";
    document.getElementById("stat-value").textContent = valueCount;

    const cards = rows.slice(0, 40).map(r => {
      const edgeVal = parseFloat(r.edge);
      const isValue = !isNaN(edgeVal) && edgeVal >= 0.05;
      const modelProb = pct(r.model_prob) || "–";
      const impliedProb = pct(r.implied_prob) || "–";
      const edgeDisplay = pct(r.edge);
      const time = r.timestamp ? new Date(r.timestamp).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      }) : "";

      return `
        <div class="match">
          <div class="names">
            <span>${r.player || "?"} <span class="vs">vs</span> ${r.opponent || "?"}</span>
          </div>
          <div class="meta">
            <div>MODEL <b>${modelProb}</b></div>
            <div>MARKET <b>${r.market_odds || "–"}</b></div>
            <div>IMPLIED <b>${impliedProb}</b></div>
          </div>
          ${edgeDisplay ? `<div class="edge-tag ${isValue ? 'pos' : 'neu'}">EDGE ${edgeDisplay}</div>` : ""}
          <div class="meta" style="margin-top:6px;"><div>${time}</div></div>
        </div>
      `;
    }).join("");

    content.innerHTML = `<div class="section-title">Recent predictions</div>${cards}`;
  }

  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error("File not found (no predictions logged yet, or repo/path is wrong)");
      return res.text();
    })
    .then(text => render(parseCSV(text)))
    .catch(err => {
      document.getElementById("content").innerHTML =
        `<div class="error">Couldn't load the log.<br>${err.message}</div>`;
    });
</script>

</body>
</html>
