<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tennis Model — Live Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #0d1b14;
    --court-line: #1c3326;
    --surface: #14261c;
    --surface-raised: #1a2f22;
    --chalk: #eef2ea;
    --chalk-dim: #8fa396;
    --ball: #d7e35a;
    --ball-dim: #8a9445;
    --up: #6fcf97;
    --down: #e0765a;
    --border: #24402f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--court);
    background-image:
      linear-gradient(var(--court-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--court-line) 1px, transparent 1px);
    background-size: 100% 3px, 3px 100%;
    background-position: 0 0, 0 0;
    background-repeat: no-repeat;
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 48px;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ball);
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 6px 0 4px;
    line-height: 1.1;
  }

  .sub {
    color: var(--chalk-dim);
    font-size: 14px;
    margin: 0;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0 28px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
  }

  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--ball);
    display: block;
  }

  .stat .label {
    color: var(--chalk-dim);
    font-size: 11px;
    margin-top: 4px;
    display: block;
  }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin: 24px 0 10px;
    color: var(--chalk);
  }

  .match {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .match .names {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .match .names span {
    font-size: 15px;
    font-weight: 600;
  }

  .match .names .vs {
    color: var(--chalk-dim);
    font-weight: 400;
    font-size: 12px;
  }

  .match .meta {
    display: flex;
    gap: 14px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .match .meta div {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
  }

  .match .meta div b {
    color: var(--chalk);
    font-weight: 500;
  }

  .match .meta div b.good { color: var(--up); font-weight: 700; }
  .match .meta div b.bad { color: var(--down); font-weight: 700; }

  .edge-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 8px;
  }

  .edge-tag.pos { background: rgba(111, 207, 151, 0.15); color: var(--up); }
  .edge-tag.neu { background: rgba(143, 163, 150, 0.15); color: var(--chalk-dim); }
  .edge-tag.bad { background: rgba(224, 118, 90, 0.15); color: var(--down); }

  .result-badge {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    margin-top: 6px;
  }
  .result-badge.good { color: var(--up); }
  .result-badge.bad { color: var(--down); }

  .match details {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  .match summary {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ball);
    cursor: pointer;
    list-style: none;
  }

  .match summary::-webkit-details-marker { display: none; }
  .match summary::before { content: "▸ "; }
  .match details[open] summary::before { content: "▾ "; }

  .score-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--chalk);
    margin: 8px 0 6px;
  }

  .status-pill {
    display: inline-block;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--up);
    background: rgba(111, 207, 151, 0.12);
    border-radius: 20px;
    padding: 2px 8px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    margin: 6px 0;
  }

  .stat-grid .label { color: var(--chalk-dim); }
  .stat-grid .p1, .stat-grid .p2 { color: var(--chalk); text-align: right; }
  .stat-grid .good { color: var(--up); font-weight: 700; }
  .stat-grid .bad { color: var(--down); }

  .timeline {
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    font-size: 12px;
    color: var(--chalk-dim);
    max-height: 160px;
    overflow-y: auto;
  }

  .timeline li {
    padding: 4px 0;
    border-bottom: 1px solid var(--court-line);
  }

  .no-stats {
    font-size: 12px;
    color: var(--chalk-dim);
    padding-top: 4px;
  }

  .h2h-record {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--chalk);
    margin: 8px 0 10px;
    text-align: center;
  }

  .h2h-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 10px;
  }

  .h2h-col-header {
    font-size: 11px;
    font-weight: 700;
    color: var(--chalk-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
    margin-bottom: 4px;
  }

  .h2h-row {
    font-size: 11px;
    padding: 3px 0;
    display: flex;
    gap: 5px;
    align-items: baseline;
  }

  .h2h-row .res { font-family: 'JetBrains Mono', monospace; font-weight: 700; width: 14px; flex-shrink: 0; }
  .h2h-row .res.W { color: var(--up); }
  .h2h-row .res.L { color: var(--down); }
  .h2h-row .opp { color: var(--chalk-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty, .loading, .error {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }

  .error { color: var(--down); }

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 32px;
  }

  a { color: var(--ball); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">// LIVE PREDICTIONS BOARD</div>
  <h1>Tennis Model</h1>
  <p class="sub">Reads directly from your GitHub prediction log — refresh to update.</p>
</header>

<main>
  <div class="stat-row" id="stat-row" style="display:none;">
    <div class="stat"><span class="num" id="stat-total">–</span><span class="label">logged</span></div>
    <div class="stat"><span class="num" id="stat-accuracy">–</span><span class="label">accuracy</span></div>
    <div class="stat"><span class="num" id="stat-value">–</span><span class="label">value bets</span></div>
  </div>

  <div id="content">
    <div class="loading">Loading predictions_log.csv from GitHub…</div>
  </div>
</main>

<footer>updated on load · edit REPO_OWNER / REPO_NAME below to point at your repo</footer>

<script>
  // ---- point this at your repo ----
  const REPO_OWNER = "arbaazshakil-dev";
  const REPO_NAME = "Live-bet-all-sport";
  const BRANCH = "main";
  const CSV_PATH = "data/predictions_log.csv";
  const STATS_PATH = "data/live_stats.json";
  // ----------------------------------

  const csvUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${CSV_PATH}`;
  const statsUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${STATS_PATH}`;

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).map(line => {
      const cells = line.split(",");
      const row = {};
      headers.forEach((h, i) => row[h] = (cells[i] || "").trim());
      return row;
    });
  }

  function pct(n) {
    const f = parseFloat(n);
    if (isNaN(f)) return null;
    return (f * 100).toFixed(1) + "%";
  }

  function statsHtml(stats) {
    if (!stats) return `<div class="no-stats">No live stats available for this match yet.</div>`;

    const score = stats.score ? `<div class="score-line">${stats.score}${stats.status ? `<span class="status-pill">${stats.status}</span>` : ""}</div>` : "";

    let statRows = "";
    if (stats.stats && typeof stats.stats === "object") {
      // higher is better, except double faults where fewer is better
      const rowsMap = {
        aces: { label: "Aces", lowerIsBetter: false },
        double_faults: { label: "Double faults", lowerIsBetter: true },
        win_1st_serve: { label: "1st serve won", lowerIsBetter: false },
        break_point_conversions: { label: "Break points won", lowerIsBetter: false },
      };
      statRows = Object.entries(rowsMap).map(([key, cfg]) => {
        const val = stats.stats[key];
        if (!Array.isArray(val)) return "";
        const n1 = parseFloat(val[0]);
        const n2 = parseFloat(val[1]);
        let cls1 = "", cls2 = "";
        if (!isNaN(n1) && !isNaN(n2) && n1 !== n2) {
          const p1Better = cfg.lowerIsBetter ? n1 < n2 : n1 > n2;
          cls1 = p1Better ? "good" : "bad";
          cls2 = p1Better ? "bad" : "good";
        }
        return `<div class="label">${cfg.label}</div><div class="p1 ${cls1}">${val[0] ?? "–"}</div><div class="p2 ${cls2}">${val[1] ?? "–"}</div>`;
      }).join("");
    }
    const statGrid = statRows
      ? `<div class="stat-grid"><div></div><div class="p1">${stats.player || "P1"}</div><div class="p2">${stats.opponent || "P2"}</div>${statRows}</div>`
      : "";

    let timelineHtml = "";
    if (Array.isArray(stats.timeline) && stats.timeline.length) {
      const items = stats.timeline.slice(-15).reverse().map(t => `<li>${t}</li>`).join("");
      timelineHtml = `<ul class="timeline">${items}</ul>`;
    }

    if (!score && !statGrid && !timelineHtml) {
      return `<div class="no-stats">No live stats available for this match yet.</div>`;
    }

    return `${score}${statGrid}${timelineHtml}`;
  }

  function h2hHtml(stats) {
    const h2h = stats && stats.h2h;
    if (!h2h) return `<div class="no-stats">No head-to-head data available for this match.</div>`;

    const formCol = (form, player) => {
      if (!form || !form.length) return `<div class="h2h-row"><span class="opp">No recent results found</span></div>`;
      return form.map(m => `<div class="h2h-row"><span class="res ${m.result}">${m.result}</span><span class="opp">vs ${m.opponent} (${m.score || "–"})</span></div>`).join("");
    };

    return `
      <div class="h2h-record">Head-to-head: ${h2h.h2h_record}</div>
      <div class="h2h-cols">
        <div>
          <div class="h2h-col-header">${stats.player || "P1"} — last 5</div>
          ${formCol(h2h.p1_form)}
        </div>
        <div>
          <div class="h2h-col-header">${stats.opponent || "P2"} — last 5</div>
          ${formCol(h2h.p2_form)}
        </div>
      </div>
    `;
  }

  function render(rows, liveStats) {
    const content = document.getElementById("content");

    if (!rows.length) {
      content.innerHTML = `<div class="empty">No predictions logged yet.<br>The board fills in once a live match has been scored by a run.</div>`;
      return;
    }

    // newest first
    rows.reverse();

    const edges = rows.map(r => parseFloat(r.edge)).filter(n => !isNaN(n));
    const valueCount = edges.filter(e => e >= 0.05).length;

    const graded = rows.filter(r => r.correct === "0" || r.correct === "1");
    const correctCount = graded.filter(r => r.correct === "1").length;
    const accuracyText = graded.length ? `${((correctCount / graded.length) * 100).toFixed(0)}%` : "–";

    document.getElementById("stat-row").style.display = "grid";
    document.getElementById("stat-total").textContent = rows.length;
    document.getElementById("stat-accuracy").textContent = accuracyText;
    document.getElementById("stat-value").textContent = valueCount;

    const matches = (liveStats && liveStats.matches) || {};

    const cards = rows.slice(0, 40).map(r => {
      const edgeVal = parseFloat(r.edge);
      const isValue = !isNaN(edgeVal) && edgeVal >= 0.05;
      const modelProb = pct(r.model_prob) || "–";
      const impliedProb = pct(r.implied_prob) || "–";
      const edgeDisplay = pct(r.edge);
      const time = r.timestamp ? new Date(r.timestamp).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      }) : "";
      const stats = r.event_id ? matches[r.event_id] : null;

      // green if the model favors this player above a coin flip, red if against
      const modelProbVal = parseFloat(r.model_prob);
      const modelCls = isNaN(modelProbVal) ? "" : (modelProbVal >= 0.5 ? "good" : "bad");
      // green edge = a real value bet, red = model disagrees with the market
      const edgeCls = isNaN(edgeVal) ? "" : (edgeVal >= 0.05 ? "good" : (edgeVal < 0 ? "bad" : ""));

      let resultBadge = "";
      if (r.correct === "1") {
        resultBadge = `<span class="result-badge good">✓ correct — ${r.actual_winner} won</span>`;
      } else if (r.correct === "0") {
        resultBadge = `<span class="result-badge bad">✗ wrong — ${r.actual_winner} won</span>`;
      }

      return `
        <div class="match">
          <div class="names">
            <span>${r.player || "?"} <span class="vs">vs</span> ${r.opponent || "?"}</span>
          </div>
          <div class="meta">
            <div>MODEL <b class="${modelCls}">${modelProb}</b></div>
            <div>MARKET <b>${r.market_odds || "–"}</b></div>
            <div>IMPLIED <b>${impliedProb}</b></div>
          </div>
          ${edgeDisplay ? `<div class="edge-tag ${isValue ? 'pos' : 'neu'} ${edgeCls}">EDGE ${edgeDisplay}</div>` : ""}
          ${resultBadge}
          <div class="meta" style="margin-top:6px;"><div>${time}</div></div>
          <details>
            <summary>Match stats &amp; score</summary>
            ${statsHtml(stats)}
          </details>
          <details>
            <summary>Head-to-head &amp; form</summary>
            ${h2hHtml(stats)}
          </details>
        </div>
      `;
    }).join("");

    content.innerHTML = `<div class="section-title">Recent predictions</div>${cards}`;
  }

  Promise.all([
    fetch(csvUrl).then(res => {
      if (!res.ok) throw new Error("predictions_log.csv not found (no predictions logged yet, or repo/path is wrong)");
      return res.text();
    }).then(parseCSV),
    fetch(statsUrl).then(res => res.ok ? res.json() : null).catch(() => null),
  ])
    .then(([rows, liveStats]) => render(rows, liveStats))
    .catch(err => {
      document.getElementById("content").innerHTML =
        `<div class="error">Couldn't load the log.<br>${err.message}</div>`;
    });

</script>

</body>
</html>
